workflows:
  android-apk:
    name: Android APK Build
    max_build_duration: 60
    environment:
      vars:
        JAVA_VERSION: 17
        GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
    scripts:
      - name: Prepare signing config
        script: |
          if [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/my-upload-key.jks"
            echo "KEYSTORE_PATH=$CM_BUILD_DIR/my-upload-key.jks" >> "$CM_ENV"
          fi

          if [ -n "$KEYSTORE_PATH" ]; then
            echo "Using keystore: $KEYSTORE_PATH"
          else
            echo "WARNING: KEYSTORE_PATH is not set. Add the keystore as a secure file or environment variable in Codemagic."
          fi

      - name: Build signed APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --parallel --stacktrace
    artifacts:
      - app/build/outputs/apk/release/*.apk
